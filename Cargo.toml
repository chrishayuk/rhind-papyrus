[package]
name = "rhind"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The Rhind Mathematical Papyrus (c. 1550 BCE), run: every figure of the scribe's working recomputed with the scribe's own operations"

[lib]
name = "rhind"
path = "src/lib.rs"

[[bin]]
name = "rhind"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
